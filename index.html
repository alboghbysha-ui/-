<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>CashClick - Earn Coins</title>
    
    <!-- SDK های تلگرام و AdsGram -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 32px;
            padding: 30px 25px;
            width: 100%;
            max-width: 380px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.2);
        }
        
        h1 {
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            margin-bottom: 30px;
        }
        
        .score-card {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 28px;
            padding: 20px;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .score-label {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
            letter-spacing: 1px;
            margin-bottom: 8px;
        }
        
        #score {
            font-size: 56px;
            font-weight: 800;
            color: #FFD700;
            line-height: 1;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }
        
        button {
            width: 100%;
            padding: 16px 20px;
            border: none;
            border-radius: 50px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 12px;
        }
        
        button:active {
            transform: scale(0.97);
        }
        
        button:disabled {
            opacity: 0.6;
            transform: none;
            cursor: not-allowed;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: #1e293b;
            box-shadow: 0 8px 20px rgba(255, 215, 0, 0.3);
        }
        
        .btn-secondary {
            background: rgba(255, 255, 255, 0.15);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            font-size: 14px;
        }
        
        .status {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
            margin-top: 20px;
            padding: 8px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 20px;
        }
        
        .footer {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.4);
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💰 CashClick</h1>
        <div class="subtitle">کلیک کن و پول بگیر!</div>
        
        <div class="score-card">
            <div class="score-label">موجودی شما (تومان)</div>
            <div id="score">0</div>
        </div>
        
        <button id="rewardBtn" class="btn-primary">🎁 تماشای تبلیغ و دریافت ۱۰۰ تومان</button>
        <button id="infoBtn" class="btn-secondary">ℹ️ چگونه کار می‌کند؟</button>
        
        <div class="status" id="status">✅ آماده | روی دکمه طلایی کلیک کن</div>
        <div class="footer">هر تبلیغ = ۱۰۰ تومان | حداقل برداشت ۵۰,۰۰۰ تومان</div>
    </div>

    <script>
        // 🔥 اتصال به بلاک تبلیغاتی شما (UnitID: 34637) - جایگزین شد!
        const AdController = window.Adsgram.init({ blockId: "34637" });
        
        let score = 0;
        const rewardBtn = document.getElementById('rewardBtn');
        const infoBtn = document.getElementById('infoBtn');
        const scoreSpan = document.getElementById('score');
        const statusDiv = document.getElementById('status');
        
        // فعال‌سازی امکانات تلگرام
        if (window.Telegram && Telegram.WebApp) {
            Telegram.WebApp.ready();
            Telegram.WebApp.expand();
            Telegram.WebApp.setHeaderColor('bg_color');
            
            Telegram.WebApp.MainButton.setText('✖️ بستن').onClick(() => Telegram.WebApp.close());
            Telegram.WebApp.MainButton.show();
        }
        
        // تابع نمایش تبلیغ و دریافت جایزه
        async function showRewardedAd() {
            try {
                const result = await AdController.show();
                
                if (result && result.done !== false) {
                    score += 100;
                    scoreSpan.innerText = score.toLocaleString();
                    statusDiv.innerHTML = '✅ +۱۰۰ تومان! ممنون از دیدن تبلیغ';
                    
                    if (window.Telegram && Telegram.WebApp) {
                        Telegram.WebApp.HapticFeedback.impactOccurred('light');
                        Telegram.WebApp.showAlert('🎉 ۱۰۰ تومان به موجودی شما اضافه شد!');
                    }
                    return true;
                } else {
                    throw new Error('تبلیغ کامل دیده نشد');
                }
            } catch (error) {
                console.error('Ad Error:', error);
                statusDiv.innerHTML = '⚠️ خطا در نمایش تبلیغ. دوباره تلاش کن';
                
                if (window.Telegram && Telegram.WebApp) {
                    Telegram.WebApp.showAlert('⚠️ تبلیغ نمایش داده نشد، اینترنت خود را بررسی کنید.');
                }
                return false;
            }
        }
        
        // رویداد کلیک روی دکمه اصلی
        rewardBtn.addEventListener('click', async () => {
            rewardBtn.disabled = true;
            const originalText = rewardBtn.innerText;
            rewardBtn.innerText = '⏳ در حال بارگذاری تبلیغ...';
            statusDiv.innerHTML = '🔄 در حال اتصال به سرور تبلیغات...';
            
            const success = await showRewardedAd();
            
            rewardBtn.disabled = false;
            rewardBtn.innerText = originalText;
            
            setTimeout(() => {
                if (statusDiv.innerHTML.includes('⚠️') || statusDiv.innerHTML.includes('🔄')) {
                    statusDiv.innerHTML = '✅ آماده | روی دکمه طلایی کلیک کن';
                }
            }, 3000);
        });
        
        // دکمه اطلاعات
        infoBtn.addEventListener('click', () => {
            const message = `📊 آمار شما\n💰 موجودی: ${score.toLocaleString()} تومان\n🎬 تعداد تبلیغ دیده شده: ${score / 100}\n\n💡 نکته: هر بار که روی دکمه طلایی کلیک کنی، یک تبلیغ ویدیویی ۱۵-۳۰ ثانیه‌ای پخش میشه و بعد از اون، ۱۰۰ تومان به حسابت اضافه میشه.\n\n✨ هرچقدر بیشتر تبلیغ ببینی، پول بیشتری جمع میکنی!`;
            
            if (window.Telegram && Telegram.WebApp) {
                Telegram.WebApp.showAlert(message);
            } else {
                alert(message);
            }
        });
        
        // پیام خوش‌آمدگویی
        setTimeout(() => {
            if (window.Telegram && Telegram.WebApp && score === 0) {
                Telegram.WebApp.showPopup({
                    title: '✨ به CashClick خوش اومدی!',
                    message: 'با دیدن تبلیغات، پول جمع کن و به راحتی برداشت کن.\n\n💰 هر تبلیغ = ۱۰۰ تومان\n🏦 حداقل برداشت = ۵۰,۰۰۰ تومان\n\n🔥 همین الان شروع کن!',
                    buttons: [{type: 'ok', text: '🚀 شروع کنم'}]
                });
            }
        }, 1000);
    </script>
</body>
</html>
