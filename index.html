<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AdFlow - Earn Money Watching Ads</title>
    
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #ffffff;
            overflow: hidden;
        }

        .app-container {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding-bottom: 20px;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, #0f3460 0%, #16213e 100%);
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logo-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .app-name {
            font-size: 28px;
            font-weight: bold;
            color: #00d4ff;
            margin-bottom: 5px;
        }

        .app-tagline {
            font-size: 14px;
            color: #a0a0a0;
        }

        /* Main Content */
        .content {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        /* Earnings Card */
        .balance-card {
            background: linear-gradient(135deg, #00d4ff 0%, #0099cc 100%);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 20px;
            color: white;
            box-shadow: 0 10px 30px rgba(0, 212, 255, 0.3);
        }

        .balance-label {
            font-size: 13px;
            opacity: 0.9;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .balance-amount {
            font-size: 42px;
            font-weight: bold;
            font-variant-numeric: tabular-nums;
            margin-bottom: 15px;
        }

        .balance-info {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
        }

        .stat-label {
            font-size: 12px;
            color: #a0a0a0;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #00d4ff;
            font-variant-numeric: tabular-nums;
        }

        /* Buttons */
        .btn-primary {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #00d4ff 0%, #0099cc 100%);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 12px;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 212, 255, 0.3);
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-secondary {
            flex: 1;
            padding: 14px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            color: white;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-secondary:active {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(0.98);
        }

        .btn-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        /* Activity List */
        .activity-section {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
        }

        .activity-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .activity-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .activity-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 13px;
        }

        .activity-item:last-child {
            border-bottom: none;
        }

        .activity-time {
            color: #a0a0a0;
        }

        .activity-reward {
            color: #00d4ff;
            font-weight: 600;
        }

        .empty-state {
            text-align: center;
            color: #a0a0a0;
            padding: 20px;
        }

        /* Info Box */
        .info-box {
            background: rgba(0, 212, 255, 0.1);
            border-left: 3px solid #00d4ff;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 20px;
            font-size: 13px;
            line-height: 1.6;
            color: #e0e0e0;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #00d4ff;
            color: #1a1a2e;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: 600;
            z-index: 1000;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        /* Loading */
        .loading {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #00d4ff;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* Scrollbar */
        .app-container::-webkit-scrollbar {
            width: 6px;
        }

        .app-container::-webkit-scrollbar-track {
            background: transparent;
        }

        .app-container::-webkit-scrollbar-thumb {
            background: rgba(0, 212, 255, 0.3);
            border-radius: 3px;
        }

        /* Responsive */
        @media (max-height: 600px) {
            .balance-card {
                padding: 15px;
            }

            .balance-amount {
                font-size: 32px;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <div class="header">
            <div class="logo-icon">💰</div>
            <div class="app-name">AdFlow</div>
            <div class="app-tagline">Earn money watching ads</div>
        </div>

        <!-- Main Content -->
        <div class="content">
            <!-- Balance Card -->
            <div class="balance-card">
                <div class="balance-label">Total Balance</div>
                <div class="balance-amount" id="balanceAmount">$0.00</div>
                <div class="balance-info">
                    <span>Today: <strong id="todayAmount">$0.00</strong></span>
                    <span>Ads Watched: <strong id="adCountDisplay">0</strong></span>
                </div>
            </div>

            <!-- Stats -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">Ads Completed</div>
                    <div class="stat-value" id="statsAds">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Daily Earnings</div>
                    <div class="stat-value" id="statsDaily">$0.00</div>
                </div>
            </div>

            <!-- Info -->
            <div class="info-box">
                💡 Watch ads to earn money. Each ad takes 15 seconds and gives you a reward!
            </div>

            <!-- Watch Ad Button -->
            <button class="btn-primary" id="watchAdBtn" onclick="watchAd()">
                Watch Ad Now 🎬
            </button>

            <!-- Quick Actions -->
            <div class="btn-row">
                <button class="btn-secondary" onclick="claimDaily()">🎁 Claim Bonus</button>
                <button class="btn-secondary" onclick="shareApp()">📤 Share</button>
            </div>

            <!-- Activity -->
            <div class="activity-section">
                <div class="activity-title">Recent Activity</div>
                <div class="activity-list" id="activityList">
                    <div class="empty-state">No activity yet</div>
                </div>
            </div>
        </div>
    </div>

    <!-- AdsBitvex SDK -->
    <script async src="https://sdk.adsbitvex.com/reward.js"></script>

    <script>
        // Initialize Telegram Web App
        let tg = window.Telegram.WebApp;
        if (tg) {
            tg.expand();
            tg.setBackgroundColor("#1a1a2e");
            tg.setHeaderColor("#0f3460");
        }

        // User Data
        let user = {
            balance: 0,
            today: 0,
            ads: 0,
            activity: [],
            publisherId: "YOUR_PUBLISHER_ID",
            appId: "YOUR_APP_ID",
            bonusClaimed: false
        };

        // Load user data from storage
        function loadUser() {
            const saved = localStorage.getItem('adflow_user');
            if (saved) {
                user = JSON.parse(saved);
            }
            updateUI();
        }

        // Save user data to storage
        function saveUser() {
            localStorage.setItem('adflow_user', JSON.stringify(user));
        }

        // Update UI
        function updateUI() {
            document.getElementById('balanceAmount').textContent = '$' + user.balance.toFixed(2);
            document.getElementById('todayAmount').textContent = '$' + user.today.toFixed(2);
            document.getElementById('adCountDisplay').textContent = user.ads;
            document.getElementById('statsAds').textContent = user.ads;
            document.getElementById('statsDaily').textContent = '$' + user.today.toFixed(2);

            // Update activity list
            const activityList = document.getElementById('activityList');
            if (user.activity.length === 0) {
                activityList.innerHTML = '<div class="empty-state">No activity yet</div>';
            } else {
                activityList.innerHTML = user.activity.map(item => `
                    <div class="activity-item">
                        <span class="activity-time">${item.type === 'ad' ? '🎬' : '🎁'} ${item.time}</span>
                        <span class="activity-reward">+$${item.amount}</span>
                    </div>
                `).join('');
            }
        }

        // Watch Ad
        function watchAd() {
            const btn = document.getElementById('watchAdBtn');
            btn.disabled = true;
            btn.textContent = 'Loading ad...';

            // Try to use AdsBitvex
            if (window.AdsBitvex && window.AdsBitvex.showRewardAd) {
                try {
                    AdsBitvex.showRewardAd({
                        onComplete: function() {
                            addReward(0.01);
                            btn.disabled = false;
                            btn.textContent = 'Watch Ad Now 🎬';
                        },
                        onError: function(error) {
                            showToast('Ad failed to load');
                            btn.disabled = false;
                            btn.textContent = 'Watch Ad Now 🎬';
                        }
                    });
                } catch (e) {
                    // Fallback
                    simulateAd();
                    btn.disabled = false;
                    btn.textContent = 'Watch Ad Now 🎬';
                }
            } else {
                // SDK not loaded - simulate
                simulateAd();
                btn.disabled = false;
                btn.textContent = 'Watch Ad Now 🎬';
            }
        }

        // Simulate Ad (for testing)
        function simulateAd() {
            const reward = (Math.random() * 0.05 + 0.01).toFixed(3);
            addReward(parseFloat(reward));
        }

        // Add Reward
        function addReward(amount) {
            user.balance += amount;
            user.today += amount;
            user.ads += 1;

            const now = new Date();
            const time = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });

            user.activity.unshift({
                type: 'ad',
                amount: amount.toFixed(2),
                time: time
            });

            if (user.activity.length > 20) {
                user.activity.pop();
            }

            saveUser();
            updateUI();
            showToast(`Earned $${amount.toFixed(3)}!`);
        }

        // Claim Daily Bonus
        function claimDaily() {
            if (user.bonusClaimed) {
                showToast('Bonus already claimed today');
                return;
            }

            const bonus = 0.5;
            user.balance += bonus;
            user.today += bonus;
            user.bonusClaimed = true;

            const now = new Date();
            const time = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });

            user.activity.unshift({
                type: 'bonus',
                amount: bonus.toFixed(2),
                time: time
            });

            saveUser();
            updateUI();
            showToast(`Daily bonus claimed! +$${bonus}`);

            // Reset bonus tomorrow
            setTimeout(() => {
                user.bonusClaimed = false;
                saveUser();
            }, 86400000);
        }

        // Share App
        function shareApp() {
            if (tg && tg.shareLink) {
                tg.shareLink('https://t.me/YourBotUsername/app', 'Check out AdFlow - Earn money by watching ads! 💰');
            } else {
                showToast('Share feature not available');
            }
        }

        // Toast notification
        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = message;
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.remove();
            }, 3000);
        }

        // Reset daily earnings at midnight
        function resetDaily() {
            const now = new Date();
            const tomorrow = new Date(now);
            tomorrow.setDate(tomorrow.getDate() + 1);
            tomorrow.setHours(0, 0, 0, 0);

            const timeUntilReset = tomorrow - now;

            setTimeout(() => {
                user.today = 0;
                user.bonusClaimed = false;
                saveUser();
                updateUI();
                resetDaily(); // Reschedule
            }, timeUntilReset);
        }

        // Initialize
        loadUser();
        resetDaily();
    </script>
</body>
</html>
