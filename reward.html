<!DOCTYPE html>
<html>
<head>
    <script>
        // دریافت پارامتر user_id از آدرس صفحه
        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('user_id');

        if (userId) {
            // ذخیره جایزه در localStorage (یا ارسال به ربات)
            localStorage.setItem(`reward_${userId}`, '100');
            // نمایش پیام موفقیت به AdsGram
            document.write('وضعیت: موفق');
        } else {
            document.write('خطا: شناسه کاربر یافت نشد');
        }
    </script>
</head>
<body></body>
</html>
